/* V3: đơn giản HUD, animation tư thế + nút countdown realtime */
.hotspot.cooling{background:#46505a;box-shadow:0 2px 8px #312e3b55}
.hotspot .spot-timer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:10px;font-style:normal;background:#fff9e9;color:#7b444e;padding:2px 5px;border-radius:6px;white-space:nowrap;font-weight:800;border:1px solid #dcb983;min-width:33px}
.activity-rows{display:grid;gap:7px}.activity-row{display:flex;gap:11px;align-items:center;background:#fffbf6;border:1px solid #e9d4b6;border-radius:12px;padding:10px}.activity-info{flex:1;display:grid;gap:3px;min-width:0}.activity-info b{font-size:13px}.activity-info small{color:#866e73;font-size:11px}.activity-icon{font-size:25px;width:40px;height:40px;display:grid;place-items:center;background:#f8e8ce;border-radius:12px}.action-detail{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center}.action-big{font-size:48px;background:#f9ead3;border:1px solid #e9d1ad;display:grid;place-items:center;height:90px;border-radius:15px}.reward{font-weight:bold;color:#937038}.action-detail p{margin:8px 0}.donation-split{display:grid;grid-template-columns:175px 1fr;gap:20px;align-items:start}.qr-placeholder{width:170px;aspect-ratio:1;background:repeating-linear-gradient(45deg,#efe0c9,#efe0c9 12px,#fff6e6 12px,#fff6e6 24px);border:3px dashed #b18469;border-radius:15px;color:#67475a;display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center;text-align:center}.qr-placeholder span{font-size:70px;line-height:1}.qr-placeholder small{color:#ad5151}.donor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.donor-name{padding:10px;background:#fff6e0;border:1px solid #e9cca2;border-radius:11px;font-weight:700}
.world-player.pose-cross svg{animation:pose-cross 1s ease-in-out infinite}.world-player.pose-pray svg{animation:pose-pray 1s ease-in-out infinite}.world-player.pose-bow svg{animation:pose-bow 1s ease-in-out infinite}.world-player.pose-kneel svg{animation:pose-kneel 1.5s ease-in-out infinite}.world-player.pose-sweep svg,.world-player.pose-clean svg,.world-player.pose-water svg,.world-player.pose-decorate svg{animation:pose-work .5s ease-in-out infinite alternate}.world-player.pose-wave svg,.world-player.pose-sing svg{animation:pose-wave .6s ease-in-out infinite alternate}

/* V3 rig: tay trái/phải có pivot độc lập để thực hiện cử chỉ rõ hơn */
.world-player svg [data-part="left-arm"]{transform-origin:40px 74px;transform-box:view-box}
.world-player svg [data-part="right-arm"]{transform-origin:80px 74px;transform-box:view-box}
.world-player.pose-cross svg [data-part="right-arm"]{animation:make-cross 2.0s ease-in-out both}
.world-player.pose-pray svg [data-part="left-arm"],.world-player.pose-pray svg [data-part="right-arm"]{animation:pray-hands-left 1.0s ease-in-out forwards}
.world-player.pose-pray svg [data-part="right-arm"]{animation-name:pray-hands-right}
.world-player.pose-wave svg [data-part="right-arm"]{animation:wave-hand .45s ease-in-out infinite alternate}
.world-player.pose-sweep svg [data-part="right-arm"],.world-player.pose-water svg [data-part="right-arm"],.world-player.pose-clean svg [data-part="right-arm"]{animation:work-arm .4s ease-in-out infinite alternate}

@keyframes wave-hand{to{transform:rotate(120deg)}}@keyframes work-arm{to{transform:rotate(-33deg)}}

<body>
<div id="game" class="game">

  </div>
  <button id="tracker" class="tracker glass" title="Mở nhiệm vụ"><span class="tracker-icon">📜</span><span><small>NHIỆM VỤ ĐANG THEO DÕI</small><strong id="trackerTitle">Gặp Lucia</strong><em id="trackerProgress">0/1 · Chạm để xem</em></span><span class="tracker-chevron">›</span></button>

  <div id="toastMount" class="toast-mount" aria-live="polite"></div>
  <nav class="dock glass" aria-label="Chức năng game">
    <button data-open="map" title="Bản đồ"><span>🗺️</span><small>Bản đồ</small></button>
    <button data-open="actions" title="Hành động"><span>🙌</span><small>Hành động</small></button>
    <button data-open="quests" title="Nhiệm vụ"><span>📜</span><small>Nhiệm vụ</small><i id="questDot" class="dot"></i></button>

function dressed(){const e=st.equipped;return {gender:st.gender,skin:st.skin,top:item(e.top)?.color||'#f8e8d6',bottom:item(e.bottom)?.color||'#465b75',shoes:item(e.shoes)?.color||'#6a443e',hair:item(e.hair)?.color||'#543932',acc:e.acc}}
function npcDressed(id){const npc=D.npcs[id];return {gender:npc.gender,shirt:npc.shirt,hair:npc.hair,bottom:npc.gender==='female'?'#5e5d7d':'#3b475c',skin:'#ecc5a5',shoes:'#554642'}}
function toast(t){$('toastMount').innerHTML=`<div class="toast">${A.esc(t)}</div>`;clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toastMount').replaceChildren(),2600)}
function log(t){st.logs.unshift({time:new Date().toISOString(),text:t});st.logs=st.logs.slice(0,35)}
function isAccepted(q){return st.accepted.includes(q.id)}function isClaimed(q){return st.claimed.includes(q.id)}
function canAccept(q){return q.requires.every(id=>st.claimed.includes(id))}
function obj(q,event){return st.progress[q.id]?.[event]||{count:0,ids:[]}}
function progressOf(q){const cur=q.steps.reduce((s,[event,n])=>s+Math.min(n,obj(q,event).count),0);const total=q.steps.reduce((s,[,n])=>s+n,0);return {cur,total,done:cur>=total}}
function record(event,unique){let updates=0;for(const q of D.quests){if(!isAccepted(q)||isClaimed(q))continue;const step=q.steps.find(s=>s[0]===event);if(!step)continue;const progress=st.progress[q.id]??={};const ob=progress[event]??={count:0,ids:[]};if(unique&&ob.ids.includes(unique))continue;if(ob.count>=step[1])continue;ob.count++;if(unique)ob.ids.push(unique);updates++;if(progressOf(q).done)toast('🎁 Nhiệm vụ hoàn tất — mở sổ nhận quà!')}
if(updates){save();renderHud()}}
function acceptQuest(id){const q=D.quests.find(q=>q.id===id);if(!q||isAccepted(q)||isClaimed(q)||!canAccept(q))return;st.accepted.push(id);st.tracked=id;
// Phục hồi những hành động có trạng thái vật thể đã thực hiện trước khi nhận nhiệm vụ.
if(id==='q_garden')for(const u of st.watered)record('water_flower',u);
if(id==='q_noel')for(const u of st.decorated)record('decorate',u);
if(id==='q_book'&&st.book)record('pickup_book','book');
if(id==='q_gift'&&st.giftDone)record('complete_gift','gift');
log('Đã nhận nhiệm vụ: '+q.name);save();toast('📜 Đã nhận nhiệm vụ: '+q.name);renderHud();openQuests('active')}
function claimQuest(id){const q=D.quests.find(q=>q.id===id);if(!q||!isAccepted(q)||isClaimed(q)||!progressOf(q).done)return;st.claimed.push(q.id);st.coins+=q.reward[1]+q.reward[2];if(st.tracked===id){st.tracked=D.quests.find(x=>isAccepted(x)&&!isClaimed(x))?.id||''}log('Đã nhận quà: '+q.name);save();renderHud();toast(`🎁 Nhận ${q.reward[1]+q.reward[2]} Xu từ nhiệm vụ!`);openQuests('active')}
function renderHud(){$('hudName').textContent=st.username||'Khách mới';$('hudCoins').textContent=fmt(st.coins);$('hudFace').innerHTML=A.avatar(dressed());$('sceneName').textContent=D.scenes[st.scene].name;$('sceneSubtitle').textContent=D.scenes[st.scene].sub;
const q=D.quests.find(q=>q.id===st.tracked&&!isClaimed(q))||D.quests.find(q=>isAccepted(q)&&!isClaimed(q))||D.quests.find(q=>canAccept(q)&&!isClaimed(q));$('trackerTitle').textContent=q?q.name:'Đã hoàn tất nhiệm vụ';const p=q?progressOf(q):null;$('trackerProgress').textContent=p?`${p.cur}/${p.total} · ${p.done?'Có quà để nhận':'Chạm để xem'}`:'Khám phá các khu vực';$('questDot').classList.toggle('active',D.quests.some(q=>isAccepted(q)&&!isClaimed(q)&&progressOf(q).done));}
function actorPoint(npcId,scene){const n=D.npcs[npcId];if(scene==='nave'&&npcId==='father')return [57,49];if(scene==='nave'&&npcId==='sister')return [27,70];if(scene==='christmas'&&npcId==='lucia')return [78,82];if(scene==='classroom'&&npcId==='sister')return [20,68];if(scene==='christmas'&&npcId==='child')return [72,75];return [n.x,n.y]}
function renderScene(){const sc=D.scenes[st.scene];$('scenery').innerHTML=A.scene(st.scene);$('actors').innerHTML='';for(const id of sc.npc){let npc=D.npcs[id],pos=actorPoint(id,st.scene),activeQuest=D.quests.some(q=>q.giver===npc.name&&canAccept(q)&&!isAccepted(q)&&!isClaimed(q));const b=document.createElement('button');b.className='actor';b.style.left=pos[0]+'%';b.style.top=pos[1]+'%';b.style.zIndex=Math.round(4+pos[1]/17);b.style.transform=`translate(-50%,-100%) scale(${(0.60+pos[1]*.0054).toFixed(3)})`;b.setAttribute('aria-label','Trò chuyện với '+npc.name);b.innerHTML=`${A.avatar(npcDressed(id))}<span class="actor-name">${A.esc(npc.name)}</span>${activeQuest?'<span class="actor-badge">!</span>':''}`;b.onclick=e=>{e.stopPropagation();moveTo(pos[0],pos[1],()=>talk(id))};$('actors').append(b)}
for(const spot of sc.spots){let [id,icon,label,x,y,kind,arg]=spot;const b=document.createElement('button');b.className='hotspot'+(kind==='repeat'&&remaining(arg)?' cooling':'')+((kind==='water'&&st.watered.includes(id))||(kind==='decorate'&&st.decorated.includes(id))?' done':'');b.style.left=x+'%';b.style.top=y+'%';b.style.zIndex=Math.round(4+y/17);b.setAttribute('aria-label',label);b.innerHTML=`${icon}<small>${A.esc(label)}</small>${kind==='repeat'?`<em class="spot-timer" data-action-timer="${arg}">${remaining(arg)?formatRemaining(remaining(arg)):'+'+ACT.find(a=>a.id===arg).coins+' Xu'}</em>`:''}`;b.onclick=e=>{e.stopPropagation();moveTo(x,y,()=>act(spot))};$('actors').append(b)}
showPlayer();if(st.scene==='nave')$('hint').textContent='🪑 Chọn ghế để ngồi • chạm NPC để trò chuyện • mở Bản đồ để đổi khu vực';else $('hint').textContent='Chạm NPC hoặc biểu tượng trong khung cảnh để tương tác';}
function showPlayer(){const el=$('worldPlayer');el.style.left=st.x+'%';el.style.top=st.y+'%';el.style.zIndex=Math.round(4+st.y/17);el.style.transform=`translate(-50%,-100%) scale(${(0.60+st.y*.0054).toFixed(3)})`;el.innerHTML=A.avatar(dressed())+`<span class="name">${A.esc(st.username||'Người chơi')}</span>`;el.classList.toggle('sitting',Boolean(st.seated))}
function cameraTo(x){if(window.innerWidth<650){const v=$('viewport'),stage=$('stage');v.scrollLeft=Math.max(0,Math.min(stage.clientWidth-v.clientWidth,stage.clientWidth*x/100-v.clientWidth*.48))}}
function moveTo(x,y,cb){if(!st.username){onboard();return}if(animTimer){clearTimeout(animTimer);animTimer=null}st.seated=false;const actor=$('worldPlayer');actor.classList.remove('sitting');actor.classList.add('walking');st.x=Math.max(8,Math.min(92,x));st.y=Math.max(29,Math.min(90,y));actor.style.left=st.x+'%';actor.style.top=st.y+'%';actor.style.zIndex=Math.round(4+st.y/17);actor.style.transform=`translate(-50%,-100%) scale(${(0.60+st.y*.0054).toFixed(3)})`;cameraTo(st.x);save();animTimer=setTimeout(()=>{actor.classList.remove('walking');animTimer=null;cb?.()},st.lowMotion?60:590)}
function travel(target){if(!D.scenes[target])return;if(animTimer){clearTimeout(animTimer);animTimer=null}st.scene=target;st.seated=false;st.x=D.scenes[target].entry[0];st.y=D.scenes[target].entry[1];save();renderHud();renderScene();if(target==='nave')record('enter_nave','first_visit');if(window.innerWidth<650)cameraTo(target==='courtyard'?44:st.x);toast('📍 '+D.scenes[target].name)}
function talk(id){const n=D.npcs[id];record(n.event,'npc:'+id);let extra='';let buttons=[['Tiếp tục',closeModal,'secondary']];if(id==='anna'&&st.book){buttons.unshift(['Trả cuốn sách',()=>{st.book=false;record('return_book','anna');log('Đã trả sách cho bà Anna');save();closeModal();toast('📚 Bà Anna cảm ơn bạn!')},'primary']);extra='<p class="muted">Bạn đang mang cuốn sách tìm được trong lớp giáo lý.</p>'}
if(id==='shopkeeper')buttons.unshift(['Mở Shop',()=>openShop(),'primary']);
const available=D.quests.find(q=>q.giver===n.name&&!isAccepted(q)&&!isClaimed(q)&&canAccept(q));if(available){extra+=`<p class="muted">📜 ${A.esc(available.name)}: ${A.esc(available.desc)}</p>`;buttons.unshift(['Nhận nhiệm vụ',()=>acceptQuest(available.id),'primary'])}
openWindow(n.name,n.role,`<div class="npc-dialogue"><div class="npc-portrait">${A.avatar(npcDressed(id))}</div><div><div class="dialogue-name">${A.esc(n.role)}</div><p class="dialogue-text">${A.esc(n.line)}</p>${extra}</div></div>`,buttons)}
const info={altar:['Bàn thờ trong Thánh lễ','Bàn thờ là trung tâm cử hành Thánh lễ. Trong game, đây là điểm tìm hiểu kiến thức; người chơi không đi vào cung thánh tự do.'],schedule:['Bảng giờ lễ (hư cấu)','Chủ nhật: 07:00 và 17:30. Ngày thường: 06:00. Đây chỉ là lịch minh họa trong trò chơi, không phải giờ lễ thực tế.']};
function act(spot){const [id,icon,label,x,y,kind,arg]=spot;
switch(kind){case 'go':travel(arg);break;
case 'repeat':openActivity(arg);break;case 'activity_hub':openActivities('here');break;
case 'seat':st.seated=true;save();$('worldPlayer').classList.add('sitting');record('sit_pew',id);toast('🪑 Bạn đã ngồi vào ghế. Chạm chỗ khác để đứng dậy.');break;
case 'info':openWindow(info[arg][0],'Tìm hiểu nhà thờ',`<p>${A.esc(info[arg][1])}</p>`,[['Đã hiểu',closeModal,'primary']]);break;
case 'learn':if(arg==='baptism'){record('learn_baptism','font');openWindow('Tìm hiểu Rửa Tội','Bài học giáo lý',`<p>Bí tích Rửa Tội là nghi thức khai tâm Kitô giáo; theo đức tin Công giáo, một người chỉ lãnh nhận bí tích này một lần.</p><p class="muted">Trong game chỉ có bài học và câu hỏi, không có nghi thức Rửa Tội thật hoặc điểm mua được bí tích.</p>`,[['Làm câu hỏi',()=>quiz('baptism'),'primary'],['Đóng',closeModal,'secondary']]);}else{record('learn_confession','conf');openWindow('Tìm hiểu Hòa Giải','Bài học giáo lý','<p>Bí tích Hòa Giải gắn với việc ăn năn, xưng tội, đón nhận ơn tha thứ và quyết tâm sửa đổi theo giáo huấn Công giáo.</p><p class="muted">Trò chơi không hỏi hoặc lưu nội dung xưng tội, không giả lập linh mục ban ơn xá giải.</p>',[['Đã hiểu',closeModal,'primary']])}break;
case 'quiz':quiz(arg);break;
case 'book':if(st.book){toast('Bạn đã nhặt sách. Đến vườn tìm bà Anna!');return}st.book=true;record('pickup_book','book');save();toast('📗 Đã nhặt sách! Mang sang vườn trả bà Anna.');break;
case 'water':if(st.watered.includes(id)){toast('🌼 Luống hoa này đã được tưới.');return}st.watered.push(id);record('water_flower',id);save();toast('💧 Một luống hoa đã được tưới.');renderScene();break;
case 'decorate':if(st.decorated.includes(id)){toast('⭐ Chỗ này đã được trang trí.');return}st.decorated.push(id);record('decorate',id);save();toast('⭐ Bạn đã thêm một món trang trí!');renderScene();break;
case 'pack':giftGame();break;
case 'rhythm':rhythmGame();break;
case 'shop':openShop();break;
default:toast('Đang phát triển khu vực này')}}
function quiz(type){const baptism=type==='baptism',question=baptism?'Theo Công giáo, Bí tích Rửa Tội được lãnh nhận bao nhiêu lần?':'Khi bước vào gian chính nhà thờ, nên làm gì?',choices=baptism?['Mỗi tháng một lần','Một lần trong đời','Mỗi khi lên cấp']:['Chạy quanh các hàng ghế','Giữ yên lặng và tôn trọng mọi người','Trèo lên bàn thờ'];openWindow('Câu hỏi nhỏ','Học mà chơi',`<p><b>${question}</b></p><div class="choices">${choices.map((c,i)=>`<button class="choice" data-answer="${i}">${A.esc(c)}</button>`).join('')}</div><p class="helper">Bạn có thể thử lại nếu chọn nhầm.</p>`,[['Để sau',closeModal,'secondary']]);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(+b.dataset.answer===1){record(baptism?'quiz_baptism':'quiz_class',type);toast('🌟 Trả lời chính xác!');closeModal()}else toast('Chưa đúng, thử lại nhé!')})}
function giftGame(){if(st.giftDone){toast('Bạn đã gói quà xong.');return}let got=[];const names=['📘 Cuốn vở','🧣 Chiếc khăn','💌 Thiệp chúc'];const paint=()=>{openWindow('Gói hộp quà sẻ chia','Mini-game 30 giây',`<p>Chọn đủ ba món để hoàn tất một hộp quà:</p><div class="choices">${names.map((name,i)=>`<button class="choice" data-gift="${i}">${got.includes(i)?'✅ ':''}${name}</button>`).join('')}</div><p class="muted">Đã chuẩn bị ${got.length}/3 món</p>`,[['Để sau',closeModal,'secondary']]);document.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{let i=+b.dataset.gift;if(!got.includes(i))got.push(i);if(got.length>=3){st.giftDone=true;record('complete_gift','gift');save();closeModal();toast('🎁 Gói quà hoàn tất!');return}paint()})};paint()}
function rhythmGame(){let index=0,sequence=['🔔','👏','🎵'];const paint=()=>{openWindow('Nhịp chuông vui','Mini-game ca đoàn',`<p>Chạm đúng nhịp theo thứ tự <b>🔔 → 👏 → 🎵</b></p><div class="progress-rail"><i style="width:${index/3*100}%"></i></div><div class="choices" style="grid-template-columns:repeat(3,1fr)">${sequence.map((s,i)=>`<button class="choice" data-rhythm="${i}" style="text-align:center;font-size:28px">${s}</button>`).join('')}</div>`,[['Rời trò chơi',closeModal,'secondary']]);document.querySelectorAll('[data-rhythm]').forEach(b=>b.onclick=()=>{if(+b.dataset.rhythm===index){index++;if(index===3){record('complete_rhythm','first');closeModal();toast('🎵 Bạn đã hoàn thành bài nhịp!')}else paint()}else{index=0;paint();toast('Lệch nhịp rồi! Thử lại từ đầu.')}})};paint()}
function openWindow(title,subtitle,body,buttons=[],wide=false){const m=$('modalMount');m.innerHTML=`<div class="scrim"><section class="window ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${A.esc(title)}"><header class="window-head"><div><h2>${A.esc(title)}</h2>${subtitle?`<small>${A.esc(subtitle)}</small>`:''}</div><button class="close" aria-label="Đóng">×</button></header><div class="window-body">${body}</div><footer class="window-foot"></footer></section></div>`;m.querySelector('.close').onclick=closeModal;m.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim')&&st.username)closeModal()};const ft=m.querySelector('.window-foot');for(const [name,fn,type] of buttons){const b=document.createElement('button');b.className='btn'+(type==='secondary'?' secondary':'');b.textContent=name;b.onclick=fn;ft.append(b)}if(!buttons.length)ft.remove();}
function closeModal(){$('modalMount').replaceChildren()}
function openMap(){const cards=Object.entries(D.scenes).map(([id,s])=>`<button class="map-tile ${st.scene===id?'active':''}" data-travel="${id}"><span>${s.icon}</span><strong>${A.esc(s.name)}</strong><small>${st.scene===id?'Đang ở đây':'Chạm để di chuyển'}</small></button>`).join('');openWindow('Bản đồ giáo xứ','Ẩn khi không sử dụng',`<p class="muted">Mỗi khu vực có NPC và hoạt động riêng. Chọn một địa điểm để chuyển cảnh.</p><div class="map-grid">${cards}</div>`,[['Đóng',closeModal,'secondary']],true);document.querySelectorAll('[data-travel]').forEach(b=>b.onclick=()=>{closeModal();travel(b.dataset.travel)})}
function openQuests(filter='active'){activeTab=filter;const tabs=[['active','Đang làm'],['all','Có thể nhận'],['done','Đã nhận quà']];let quests=D.quests.filter(q=>filter==='active'?isAccepted(q)&&!isClaimed(q):filter==='all'?!isAccepted(q)&&!isClaimed(q):isClaimed(q));const t=`<div class="pilltabs">${tabs.map(([k,v])=>`<button class="${k===filter?'active':''}" data-quest-tab="${k}">${v}</button>`).join('')}</div>`;const rows=quests.map(q=>{const p=progressOf(q),eligible=canAccept(q);let action=isClaimed(q)?'Đã hoàn thành':isAccepted(q)?p.done?'Nhận quà':'Theo dõi':eligible?'Nhận nhiệm vụ':'Chưa mở';let disabled=!eligible&&!isAccepted(q)||isClaimed(q);return `<div class="quest-row"><div><h3>${q.type==='main'?'⭐':q.type==='service'?'🌿':q.type==='lesson'?'📖':'🎵'} ${A.esc(q.name)}</h3><p>${A.esc(q.desc)}</p>${isAccepted(q)?`<div class="progress-rail"><i style="width:${100*p.cur/p.total}%"></i></div>`:''}<div class="step">${isAccepted(q)?q.steps.map(([e,n,title])=>`${A.esc(title)} (${Math.min(n,obj(q,e).count)}/${n})`).join(' · '):`Giao bởi ${A.esc(q.giver)}`}</div><div class="reward">+🪙 ${q.reward[1]+q.reward[2]} Xu</div>${!eligible&&!isAccepted(q)?`<small class="locked-badge">Cần hoàn thành: ${q.requires.map(id=>D.quests.find(x=>x.id===id)?.name).join(', ')}</small>`:''}</div><button class="btn small ${disabled?'secondary':''}" data-quest-action="${q.id}" ${disabled?'disabled':''}>${action}</button></div>`}).join('')||'<div class="empty">Chưa có nhiệm vụ trong nhóm này. Hãy gặp các NPC để khám phá thêm.</div>';openWindow('Sổ nhiệm vụ','Nhận việc nhỏ, làm rồi mới nhận phần thưởng',t+rows,[['Đóng',closeModal,'secondary']],true);document.querySelectorAll('[data-quest-tab]').forEach(b=>b.onclick=()=>openQuests(b.dataset.questTab));document.querySelectorAll('[data-quest-action]').forEach(b=>b.onclick=()=>{let q=D.quests.find(x=>x.id===b.dataset.questAction);if(!isAccepted(q))acceptQuest(q.id);else if(progressOf(q).done)claimQuest(q.id);else{st.tracked=q.id;save();renderHud();closeModal();toast('📌 Đã theo dõi: '+q.name)}})}
const slotTitles={top:'Áo',bottom:'Quần/Váy',shoes:'Giày',hair:'Tóc',acc:'Phụ kiện'};
function shopCards(slot,onlyOwned=false){return D.items.filter(i=>(slot==='kindness'?Boolean(i.kindnessPrice):i.slot===slot)&&(!onlyOwned||st.inventory.includes(i.id))).map(i=>{const owned=st.inventory.includes(i.id),equip=st.equipped[i.slot]===i.id,locked=false;return `<div class="item-card ${equip?'equipped':''} ${locked?'locked':''}"><span class="item-visual">${i.icon}</span><strong>${A.esc(i.name)}</strong><small>${(i.kindnessPrice?i.kindnessPrice*2:i.price)===0?'Miễn phí':'🪙 '+fmt(i.kindnessPrice?i.kindnessPrice*2:i.price)}</small><button class="btn small ${owned?'secondary':''}" data-item="${i.id}" ${locked||equip?'disabled':''}>${equip?'Đang mặc':owned?'Mặc':locked?'Chưa đủ cấp':'Mua'}</button></div>`}).join('')}
function openShop(slot=shopSlot){shopSlot=slot;const tabs=Object.entries({...slotTitles,kindness:'Trang phục sẻ chia'}).map(([id,name])=>`<button class="${id===slot?'active':''}" data-slot="${id}">${name}</button>`).join('');openWindow('Shop trang phục',`🪙 ${fmt(st.coins)} Xu · thử đồ trước khi mua`,`<div class="outfit-layout"><div><div class="avatar-stage">${A.avatar(dressed())}</div><p class="equip-label">${A.esc(st.username)} · Trang phục đang mặc</p></div><div><div class="pilltabs">${tabs}</div><div class="items-grid">${shopCards(slot)}</div></div></div><p class="helper">Trang phục thường ngày / lễ hội; không bán phẩm phục linh mục hay bí tích. Không yêu cầu level, chỉ dùng Xu trong game.</p>`,[['Đóng',closeModal,'secondary']],true);document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>openShop(b.dataset.slot));document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>buyOrEquip(b.dataset.item,()=>openShop(shopSlot)))}
function buyOrEquip(id,rerender){const i=item(id);if(!i)return;if(!st.inventory.includes(id)){const price=i.kindnessPrice?i.kindnessPrice*2:i.price;if(st.coins<price)return toast('Chưa đủ Xu. Hãy làm nhiệm vụ hoặc các hành động nhỏ!');st.coins-=price;st.inventory.push(id);log('Mua '+i.name);toast('🛍️ Đã mua '+i.name)}st.equipped[i.slot]=i.id;save();renderHud();showPlayer();rerender?.()}
function openBag(slot='top'){const tabs=Object.entries(slotTitles).map(([id,n])=>`<button class="${id===slot?'active':''}" data-bag-tab="${id}">${n}</button>`).join('');openWindow('Túi đồ','Chỉ hiển thị những món đã sở hữu',`<div class="pilltabs">${tabs}</div><div class="items-grid">${shopCards(slot,true)}</div><p class="muted">Bạn có ${st.inventory.length} món đồ. Nhấn Mặc để cập nhật ngay trang phục nhân vật trên bản đồ.</p>`,[['Đóng',closeModal,'secondary']],true);document.querySelectorAll('[data-bag-tab]').forEach(b=>b.onclick=()=>openBag(b.dataset.bagTab));document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>buyOrEquip(b.dataset.item,()=>openBag(slot)))}
function openAvatar(){openWindow('Nhân vật','Chọn giới tính nhân vật và phối đồ',`<div class="outfit-layout"><div class="avatar-stage">${A.avatar(dressed())}</div><div><p><b>${A.esc(st.username)}</b> · Cư dân giáo xứ</p><p class="muted">Avatar được vẽ bằng các lớp: đầu, tóc, thân, tay, chân, áo, quần/váy và phụ kiện.</p><div class="gender-select"><button class="btn ${st.gender==='male'?'':'secondary'}" data-gender="male">👦 Nam</button><button class="btn ${st.gender==='female'?'':'secondary'}" data-gender="female">👧 Nữ</button></div><div class="pilltabs"><button class="active" data-color="#f7cfac">Da sáng</button><button data-color="#d9a77f">Da ấm</button><button data-color="#ae7658">Da nâu</button></div><button class="btn block" data-open="bag">🎒 Chọn trang phục đã mua</button></div></div>`,[['Xong',closeModal,'primary']],true);document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{st.gender=b.dataset.gender;save();renderHud();showPlayer();openAvatar()});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{st.skin=b.dataset.color;save();renderHud();showPlayer();openAvatar()});document.querySelectorAll('.window [data-open]').forEach(b=>b.onclick=()=>openBag())}
function openEvents(){const q=D.quests.find(q=>q.id==='q_noel');openWindow('Sự kiện Giáng sinh','Lễ hội trong thế giới hư cấu của game',`<div class="event-art"><strong>⭐ Đêm ánh sáng An Hòa</strong><p>Giúp mọi người hoàn thiện khu vực hang đá và cây thông, không cần cày điểm vô hạn.</p></div><div class="card" style="margin-top:12px"><h3>🎄 Nhiệm vụ: ${q.name}</h3><p>${q.desc}</p><div class="reward">${q.reward[1]+q.reward[2]} Xu</div><button class="btn" data-noel>Đến quảng trường</button></div><p class="helper">Sự kiện này có thể chơi thử ngay trong bản offline. Phiên bản online có thể thêm lịch theo mùa, nhưng không dùng ngày ngoài đời làm điều kiện bắt buộc.</p>`,[['Đóng',closeModal,'secondary']]);document.querySelector('[data-noel]').onclick=()=>{closeModal();travel('christmas')}}
function openMenu(){openWindow('Cài đặt & thông tin','Tối ưu máy yếu, lưu tiến độ',`<p><b>Điều khiển:</b> chạm NPC để nói chuyện; chạm điểm sáng để hành động; chạm nền để nhân vật đi tới. Trên điện thoại dọc, vuốt ngang để ngắm toàn bộ bản đồ.</p><label class="theme-checkbox"><input type="checkbox" id="reduceMotion" ${st.lowMotion?'checked':''}> Chế độ tiết kiệm hiệu ứng</label><p class="helper">Đồ họa SVG 2D tĩnh và animation CSS nhẹ. Bản demo offline lưu bằng localStorage; chưa có đăng nhập máy chủ hay đồng bộ giữa thiết bị.</p><div class="choices"><button class="choice" id="goDonation">💝 Hòm ủng hộ & bảng tri ân</button><button class="choice" id="goActivities">🙌 Xem các hoạt động</button><button class="choice" id="goWardrobe">🎒 Túi đồ đã mua</button><button class="choice" id="goEvents">🎄 Trang trí Giáng sinh</button><button class="choice" id="goFoyer">🚪 Đến tiền sảnh nhà thờ</button><button class="choice" id="goShopRoom">🛍️ Tham quan gian trang phục</button><button class="choice" id="resetGame" style="color:#a6454a">🗑️ Xóa dữ liệu chơi thử và tạo lại nhân vật</button></div>`,[['Đóng',closeModal,'secondary']]);$('goDonation').onclick=openDonations;$('goActivities').onclick=()=>openActivities();$('goWardrobe').onclick=()=>openBag();$('goEvents').onclick=()=>openEvents();$('reduceMotion').onchange=e=>{st.lowMotion=e.target.checked;document.body.classList.toggle('low-motion',st.lowMotion);save()};$('goFoyer').onclick=()=>{closeModal();travel('foyer')};$('goShopRoom').onclick=()=>{closeModal();travel('shoproom')};$('resetGame').onclick=()=>{if(confirm('Xóa toàn bộ tiến độ trong trình duyệt này?')){st=initial();save();closeModal();renderHud();renderScene();onboard()}}}
function open(name){if(!st.username)return onboard();switch(name){case 'map':openMap();break;case 'actions':openActivities();break;case 'donations':openDonations();break;case 'quests':openQuests('active');break;case 'avatar':openAvatar();break;case 'shop':openShop();break;case 'bag':openBag();break;case 'events':openEvents();break;case 'menu':openMenu();break;}}
function onboard(){let g=st.gender;const paint=()=>{openWindow('Chào mừng đến Giáo Xứ An Hòa','Tạo nhân vật để bắt đầu hành trình',`<div class="onboard"><div class="avatar-stage">${A.avatar({...dressed(),gender:g})}</div><div><p class="muted">Khám phá nhà thờ 2D, gặp NPC, làm các nhiệm vụ ngắn và mua trang phục bằng Xu tích lũy, không có cấp độ. Game được thiết kế cho web và điện thoại.</p><label class="field">Tên nhân vật<input id="inputName" maxlength="20" autocomplete="off" placeholder="Ví dụ: An Nhiên" value="${A.esc(st.username)}"></label><div class="gender-select"><button class="btn ${g==='male'?'':'secondary'}" data-choose="male">👦 Nhân vật nam</button><button class="btn ${g==='female'?'':'secondary'}" data-choose="female">👧 Nhân vật nữ</button></div><p class="helper">Chỉ là nhân vật trong game. Không yêu cầu khai báo tín ngưỡng, không thu thập lời cầu nguyện hay xưng tội.</p></div></div>`,[['Bắt đầu chơi',()=>{const val=$('inputName').value.trim();if(!val){toast('Hãy nhập tên nhân vật!');return}st.username=val.slice(0,20);st.gender=g;save();closeModal();renderHud();renderScene();toast('🌷 Chào '+st.username+'! Hãy gặp Lucia ở sân.')},'primary']]);document.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{const val=$('inputName').value;g=b.dataset.choose;st.gender=g;st.username=val;paint()})};paint()}

// ======= CÁC HÀNH ĐỘNG LẶP LẠI (DEMO LOCAL; production phải xác thực trên server) =======
const cooldownFor=id=>ACT.find(a=>a.id===id);
const remaining=id=>Math.max(0,Number(st.cooldowns?.[id]||0)-Date.now());
function formatRemaining(ms){const n=Math.ceil(ms/1000),m=Math.floor(n/60),s=n%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function renderCooldowns(){document.querySelectorAll('[data-action-timer]').forEach(el=>{const a=cooldownFor(el.dataset.actionTimer);if(!a)return;const rem=remaining(a.id);el.textContent=rem?formatRemaining(rem):'+'+a.coins+' Xu';el.closest('.hotspot')?.classList.toggle('cooling',!!rem)});document.querySelectorAll('[data-activity-button]').forEach(b=>{const a=cooldownFor(b.dataset.activityButton);if(!a)return;const rem=remaining(a.id);b.textContent=rem?'⏳ '+formatRemaining(rem):'Thực hiện +'+a.coins+' Xu';b.disabled=!!rem||activityBusy;});}
function openActivities(category='all'){const tabs=[['here','Tại đây'],['all','Tất cả'],['cau_nguyen','Cầu nguyện'],['phuc_vu','Phục vụ'],['sinh_hoat','Sinh hoạt']].map(([id,n])=>`<button data-act-category="${id}" class="${category===id?'active':''}">${n}</button>`).join('');const rows=ACT.filter(a=>category==='all'||category==='here'&&a.scene===st.scene||a.category===category).map(a=>`<div class="activity-row"><div class="activity-icon">${a.icon}</div><div class="activity-info"><b>${A.esc(a.name)}</b><small>${A.esc(D.scenes[a.scene].name)} · Hồi ${a.cooldown/60} phút · +${a.coins} Xu</small></div><button class="btn small secondary" ${st.scene===a.scene?`data-activity-button="${a.id}"`: `data-activity-open="${a.id}"`}>${st.scene===a.scene?(remaining(a.id)?'⏳ '+formatRemaining(remaining(a.id)):'Thực hiện +'+a.coins+' Xu'):'Đến nơi'}</button></div>`).join('');openWindow('Hành động','Công việc nhỏ, hoạt động ngắn; nút có thời gian hồi',`<div class="pilltabs">${tabs}</div><div class="activity-rows">${rows}</div><p class="helper">Xu là điểm trò chơi, không đo công phúc và không thay thế việc cầu nguyện/Thánh lễ thật. Các hành động tôn kính mô phỏng đúng ngữ cảnh, không thực hiện trước bàn thờ như trò biểu diễn.</p>`,[['Đóng',closeModal,'secondary']],true);document.querySelectorAll('[data-act-category]').forEach(b=>b.onclick=()=>openActivities(b.dataset.actCategory));document.querySelectorAll('[data-activity-button]').forEach(b=>b.onclick=()=>runActivity(b.dataset.activityButton));renderCooldowns();document.querySelectorAll('[data-activity-open]').forEach(b=>b.onclick=()=>{let a=cooldownFor(b.dataset.activityOpen);if(st.scene!==a.scene){closeModal();travel(a.scene);toast('📍 Chọn biểu tượng 🙌 Hành động tại đây.')}else openActivity(a.id)})}
function openActivity(id){const a=cooldownFor(id);if(!a)return;const rem=remaining(id);openWindow(a.name,`Vị trí: ${D.scenes[a.scene].name}`,`<div class="action-detail"><div class="action-big">${a.icon}</div><div><p>${A.esc(a.tip)}</p><p class="reward">🪙 +${a.coins} Xu · ⏱ Hồi ${a.cooldown/60} phút</p><p class="muted">Sau khi hoàn tất, đồng hồ sẽ chạy ngay trong nút hành động tại đây và ngoài bản đồ.</p></div></div><button class="btn block" data-activity-button="${id}" ${rem?'disabled':''}>${rem?'⏳ '+formatRemaining(rem):'Thực hiện +'+a.coins+' Xu'}</button>`,[['Đóng',closeModal,'secondary']]);document.querySelector('[data-activity-button]').onclick=()=>runActivity(id);renderCooldowns()}
function runActivity(id){const a=cooldownFor(id);if(!a||remaining(id)||activityBusy||st.scene!==a.scene)return;activityBusy=true;closeModal();const player=$('worldPlayer');player.classList.add('pose-'+a.pose);toast(`${a.icon} ${a.name}...`);
  setTimeout(()=>{player.classList.remove('pose-'+a.pose);st.coins+=a.coins;st.cooldowns[id]=Date.now()+a.cooldown*1000;st.activityCount[id]=(st.activityCount[id]||0)+1;st.activityHistory.unshift({id,at:new Date().toISOString(),coins:a.coins});st.activityHistory=st.activityHistory.slice(0,70);activityBusy=false;log(`Hoàn thành ${a.name} +${a.coins} Xu`);save();renderHud();renderCooldowns();toast(`🪙 +${a.coins} Xu! Hẹn gặp lại sau ${a.cooldown/60} phút.`);openActivity(id)},st.lowMotion?500:a.seconds*1000);
}
// ======= HÒM ỦNG HỘ: QUỸ ẢO KHÁC HOÀN TOÀN TIỀN THẬT =======
function openDonations(tab='virtual'){
 const tabs=[['virtual','🏘️ Xu xây dựng'],['real','💝 Ủng hộ thật'],['board','🏅 Bảng tri ân']].map(([id,n])=>`<button data-donation-tab="${id}" class="${tab===id?'active':''}">${n}</button>`).join('');let body='';
 if(tab==='virtual')body=`<div class="card"><h3>🌷 Chung tay trang trí giáo xứ trong trò chơi</h3><p>Dùng Xu ảo để hỗ trợ mục tiêu chung; không phải tiền thật hoặc công đức tôn giáo.</p><p><b>Số Xu của bạn:</b> 🪙 ${fmt(st.coins)}</p><div class="choices"><button class="choice" data-virtual-give="50">Đóng góp 50 Xu · Trang trí chậu hoa</button><button class="choice" data-virtual-give="150">Đóng góp 150 Xu · Thêm đèn Noel</button><button class="choice" data-virtual-give="300">Đóng góp 300 Xu · Sửa góc sinh hoạt</button></div></div>`;
 if(tab==='real')body=`<div class="donation-split"><div class="qr-placeholder"><span>▦</span><b>QR NGÂN HÀNG</b><small>Chưa cấu hình</small></div><div><h3>💝 Ủng hộ phát triển trò chơi</h3><p>Đây là khoản <b>ủng hộ tự nguyện cho người phát triển/vận hành game</b>, không phải tiền giỏ, tiền xin lễ hay đóng góp cho một giáo xứ thật nếu chưa được ủy quyền.</p><p>Admin cần khai báo <b>tên chủ tài khoản, ngân hàng, tài khoản, QR thật, mục đích sử dụng</b> trên máy chủ và chính sách hoàn tiền/đối soát. Game demo không nhận giao dịch ngân hàng.</p><p class="muted">Quét QR không có nghĩa là đã thanh toán. Chỉ giao dịch được xác minh từ ngân hàng/cổng thanh toán mới mang trạng thái Đã nhận.</p></div></div><div class="card" style="margin-top:12px"><h3>Kiểm thử quy trình tri ân (KHÔNG CHUYỂN TIỀN)</h3><label class="field">Tên muốn hiển thị<input maxlength="36" id="donorName" placeholder="Ví dụ: Minh An"></label><label class="theme-checkbox"><input type="checkbox" id="donorConsent"> Tôi đồng ý công khai tên này trên bảng tri ân thử nghiệm.</label><button class="btn block" id="demoDonate">Tạo yêu cầu thử nghiệm</button><p class="helper">Bản demo chỉ mô phỏng yêu cầu/duyệt nội bộ. Không xem ảnh biên lai là bằng chứng đã thanh toán.</p></div>`;
 if(tab==='board'){const approved=st.donorBoard.filter(x=>x.approved);body=`<div class="card"><h3>🌼 Những tấm lòng đồng hành</h3><p>Chỉ hiển thị tên được đồng ý công khai và khoản đã được xác minh; không xếp hạng theo số tiền.</p><div class="donor-grid">${approved.length?approved.map(x=>`<div class="donor-name">🌷 ${A.esc(x.display)} <small>(DEMO)</small><button class="btn small secondary" data-demo-hide="${x.id}">Ẩn tên</button></div>`).join(''):'<div class="empty">Chưa có tên được công khai.</div>'}</div></div><div class="card" style="margin-top:12px"><h3>Quản lý kiểm thử (chỉ bản offline)</h3><p class="muted">Danh sách dưới đây là dữ liệu mô phỏng trên máy này. Khi lên web, thay bằng trang Admin có phân quyền và đối soát giao dịch thật.</p>${st.donationDemo.filter(x=>x.status==='pending').map(x=>`<div class="activity-row"><div class="activity-info"><b>${A.esc(x.display)}</b><small>Yêu cầu mô phỏng, chưa xác minh ngân hàng</small></div><button class="btn small" data-demo-approve="${x.id}">Duyệt DEMO</button></div>`).join('')||'<p class="muted">Chưa có yêu cầu kiểm thử.</p>'}</div>`;}
 openWindow('Hòm ủng hộ & Tri ân','Hai hệ thống độc lập: Xu ảo và ủng hộ tiền thật',`<div class="pilltabs">${tabs}</div>${body}`,[['Đóng',closeModal,'secondary']],true);
 document.querySelectorAll('[data-donation-tab]').forEach(b=>b.onclick=()=>openDonations(b.dataset.donationTab));
 document.querySelectorAll('[data-virtual-give]').forEach(b=>b.onclick=()=>{const amount=Number(b.dataset.virtualGive);if(st.coins<amount)return toast('Bạn chưa đủ Xu!');st.coins-=amount;st.virtualFund=(st.virtualFund||0)+amount;log(`Đóng góp ${amount} Xu cho giáo xứ ảo`);save();renderHud();toast('🌷 Cảm ơn đã góp '+amount+' Xu!');openDonations('virtual')});
 const request=$('demoDonate');if(request)request.onclick=()=>{const display=$('donorName').value.trim().slice(0,36);if(!display||!$('donorConsent').checked)return toast('Nhập tên và đồng ý công khai để mô phỏng bảng tri ân.');const id='demo-'+Date.now();st.donationDemo.push({id,display,status:'pending',at:new Date().toISOString()});save();toast('Đã tạo yêu cầu DEMO, chưa xác minh tiền thật');openDonations('board')};
 document.querySelectorAll('[data-demo-hide]').forEach(b=>b.onclick=()=>{const r=st.donorBoard.find(x=>x.id===b.dataset.demoHide);if(r)r.approved=false;save();openDonations('board')});
 document.querySelectorAll('[data-demo-approve]').forEach(b=>b.onclick=()=>{const r=st.donationDemo.find(x=>x.id===b.dataset.demoApprove);if(!r)return;r.status='demo_approved';st.donorBoard.push({id:r.id,display:r.display,approved:true,simulated:true});save();toast('Đã thêm tên vào bảng TRI ÂN DEMO');openDonations('board')});
}
setInterval(()=>{if(st.username)renderCooldowns()},1000);

// Events
for(const b of document.querySelectorAll('.dock [data-open]'))b.onclick=()=>open(b.dataset.open);$('profileQuick').onclick=()=>openAvatar();$('tracker').onclick=()=>openQuests('active');$('stage').onclick=e=>{if(!st.username||$('modalMount').childNodes.length)return;const r=$('stage').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(y>41&&y<93)moveTo(x,y)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.username)closeModal();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&!$('modalMount').childNodes.length){e.preventDefault();const n=3;moveTo(st.x+({ArrowLeft:-n,ArrowRight:n}[e.key]||0),st.y+({ArrowUp:-n,ArrowDown:n}[e.key]||0))}});
document.body.classList.toggle('low-motion',st.lowMotion);renderHud();renderScene();if(!st.username)onboard();if(window.innerWidth<650){setTimeout(()=>cameraTo(st.scene==='courtyard'?44:st.x),40)}
})();
</script>
</body></html>
